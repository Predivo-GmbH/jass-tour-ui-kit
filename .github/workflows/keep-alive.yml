name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    # Public repository: GitHub-hosted runners only (SR-SUP-08; reviewed 2026-11-04).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (real DB query via GraphQL)
        run: |
          echo "=== GraphQL ping (real DB query via pg_graphql) ==="
          gql_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/graphql/v1" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}')
          echo "GraphQL response: $gql_response"

          echo "=== Auth ping (backup) ==="
          auth_response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@ping.local","password":"keepalive"}')
          echo "Auth response: $auth_response"

          if [ "$gql_response" = "000" ] && [ "$auth_response" = "000" ]; then
            echo "::error::Supabase project appears completely unreachable"
            exit 1
          fi

          if [ "$gql_response" != "200" ]; then
            echo "::error::GraphQL ping returned $gql_response — database may be paused"
            exit 1
          fi

          echo "Supabase project pinged successfully — real DB activity registered"
