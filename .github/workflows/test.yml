name: Critical Path Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  critical-path:
    # Public repository: GitHub-hosted runners only (SR-SUP-08; reviewed 2026-11-04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run --maxWorkers=2

      # DISCOVERED, NOT LISTED. Until 2026-10-06 no workflow here ran an offline scripts/*.test.mjs.
      # The glob means a guard added tomorrow runs without anybody remembering to add a line.
      # Absence is not success: an empty glob FAILS, otherwise a moved directory switches the whole
      # thing off while still printing green. *.prod.test.mjs and *.live.test.mjs are CARVED OUT
      # (named, never silent): signin-captcha.prod.test.mjs probes the live project and has its own
      # workflow (auth-captcha.yml); a pull-request check must not reach production.
      - name: Guard suites (discovered, not listed)
        run: |
          set -e
          shopt -s nullglob
          suites=()
          for f in scripts/*.test.mjs scripts/lib/*.test.mjs; do
            case "$f" in
              *.prod.test.mjs|*.live.test.mjs) echo "NOT run here (probes production): $f" ;;
              *) suites+=("$f") ;;
            esac
          done
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no offline scripts/*.test.mjs found - the guard suites are not running"
            exit 1
          fi
          echo "running ${#suites[@]} guard suite(s): ${suites[*]}"
          node --test --test-concurrency=2 "${suites[@]}"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright's system packages from earlier runs (an Ubuntu mirror outage then costs nothing)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ hashFiles('package-lock.json', '*/package-lock.json') }}
          restore-keys: playwright-debs-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/.github/gate-kit/scripts/install-playwright.sh" chromium

      - name: Verify production stylesheet compatibility
        run: npm run test:styles
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: local-preview-placeholder

      - name: Check the built public files and Apache config offline
        env:
          SECURITY_BUILT_HTACCESS: dist/.htaccess
        run: |
          node scripts/check-dist-private-files.mjs dist
          node --test --test-concurrency=2 scripts/lib/security-htaccess.test.mjs

      # Three backend health probes are retained as @live tests for authorised manual
      # runs. PR checks exercise this checkout offline and must not contact production.
      - name: Run local critical path tests
        run: npx playwright test e2e/critical-path.spec.ts --grep-invert '@live' --workers=2
        env:
          # SAY WHAT WE BUILT. This spec used to default to https://Beize-Jass-Tour.mueller.ro and
          # nothing in this repository ever set BASE_URL, so the gate tested the live site instead
          # of the commit. e2e/base-url.ts now REFUSES to start in CI when this is missing, so the
          # address and the build cannot drift apart. 5173 is the port playwright.config.ts starts
          # its webServer on when E2E_PORT is not supplied.
          BASE_URL: http://localhost:5173
          OFFLINE_E2E: '1'
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_PUBLISHABLE_KEY: local-preview-placeholder

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: critical-path-results
          path: playwright-report/

  sast:
    # Public repository: GitHub-hosted runners only (SR-SUP-08; reviewed 2026-11-04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: SAST scan (blocking, deploy-standard §4d)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  workflow-report:
    # Public repository: GitHub-hosted runners only (SR-SUP-08; reviewed 2026-11-04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Zizmor workflow report (advisory)
        continue-on-error: true
        uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0
        with:
          version: v1.32.0
          advanced-security: false
          online-audits: false
