name: Critical Path Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify production stylesheet compatibility
        run: npm run test:styles
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: local-preview-placeholder

      # Public-safe Supabase client config (see deploy.yml) — the Playwright
      # webServer runs `npm run dev`, which needs these since .env was untracked
      # in e877113. Vite exposes process.env vars prefixed with VITE_.
      - name: Run critical path tests
        run: npx playwright test e2e/critical-path.spec.ts
        env:
          # SAY WHAT WE BUILT. This spec used to default to https://Beize-Jass-Tour.mueller.ro and
          # nothing in this repository ever set BASE_URL, so the gate tested the live site instead
          # of the commit. e2e/base-url.ts now REFUSES to start in CI when this is missing, so the
          # address and the build cannot drift apart. 5173 is the port playwright.config.ts starts
          # its webServer on when E2E_PORT is not supplied.
          BASE_URL: http://localhost:5173
          VITE_SUPABASE_URL: https://uyksotlmrlxhmyeopktl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: uyksotlmrlxhmyeopktl

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: critical-path-results
          path: playwright-report/
